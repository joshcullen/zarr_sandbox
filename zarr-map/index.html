<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>Zarr Map Visualization</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="map-tools">
      <div id="depth-control" class="control-card">
        <div class="control-label depth-label">
          <span>Depth</span>
          <strong id="z-val">5 m</strong>
        </div>
      
        <div class="depth-control-body">
          <input type="range" id="z-slider" min="0" max="19" value="0">
        
          <svg class="depth-axis-svg" viewBox="0 0 58 128" aria-hidden="true">
            <line class="axis-domain" x1="8" x2="8" y1="10" y2="118"></line>
          
            <g class="axis-tick" transform="translate(8, 10)">
              <line x2="8"></line>
              <text x="13" dy="0.32em">5 m</text>
            </g>
          
            <g class="axis-tick" transform="translate(8, 64)">
              <line x2="8"></line>
              <text x="13" dy="0.32em">100 m</text>
            </g>
          
            <g class="axis-tick" transform="translate(8, 118)">
              <line x2="8"></line>
              <text x="13" dy="0.32em">195 m</text>
            </g>
          
            <line class="axis-highlight" x1="8" x2="8" y1="10" y2="118"></line>
          </svg>
        </div>
      </div>


      <div id="time-control" class="control-card">
        <div class="control-label">
          <span>Date</span>
          <strong id="time-val">2024-03-05</strong>
        </div>
        
        <div class="time-control-body">
          <svg id="time-axis-svg" class="time-axis-svg" aria-hidden="true"></svg>
          <input type="range" id="time-slider" min="0" max="559" value="0">
        </div>
      </div>
    </div>

    <div id="query-panel">
      <p><strong>Query CHLA concentration</strong></p>
    
      <div class="query-row">
        <span>Hover point</span>
        <strong id="hover-pixel-val">--</strong>
      </div>
    
      <div class="query-row">
        <span>Drawn region mean</span>
        <strong id="region-mean-val">--</strong>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
